<html lang="pt-br">
<head>
    <title>Calculadora</title>
</head>
<body>
<center>
<input type="hidden" id="valorMemoria">
<input type="hidden" id="operacao">
<input id="display" type="text">
<br/>
<input onclick= "clickButton(7)" type="button" value="7">
<input onclick= "clickButton(8)" id="oito" type="button" value="8">
<input onclick= "clickButton(9)" id="nove" type="button" value="9">
<input onclick= "operacoes('/')" id="divisao" type="button" value="/">
<br/>
<input onclick= "clickButton(4)" id="quatro" type="button" value="4">
<input onclick= "clickButton(5)" id="cinco" type="button" value="5">
<input onclick= "clickButton(6)" id="seis" type="button" value="6">
<input onclick= "operacoes('*')" id="vezes" type="button" value="*">
<br/>
<input onclick= "clickButton(1)" id="um" type="button" value="1">
<input onclick= "clickButton(2)" id="dois" type="button" value="2">
<input onclick= "clickButton(3)" id="tres" type="button" value="3">
<input onclick= "operacoes('-')" id="menos" type="button" value="-">
<br/>
<input onclick= "clickButton(0)" id="zero" type="button" value="0">
<input onclick= "clickButton('.')" id="ponto"type="button" value=".">
<input onclick= "operacoes('=')" id="igual"type="button" value="=">
<input onclick= "operacoes('+')" id="mais"type="button" value="+">
</center>
</body>
</html>
<script>
    let valorMemoria = 0
    let valorAntigo = 0
    let resultado = 0

function clickButton(valor){
        display = document.getElementById("display")
        display.value += valor
}
function operacoes(op) {
    let display = document.getElementById("display");
    let valorMemoria = document.getElementById("valorMemoria")
    switch (op) {
        case "+":
            valorAntigo = display.value;
            valorMemoria = display.value;
            display.value = "";
            valorMemoria = display.value;
            resultado = valorMemoria+valorAntigo;
            display.value = resultado;
            break;
    }
}
</script>
